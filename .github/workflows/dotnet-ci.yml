# API CI: builds and publishes the API on every push, and deploys it to Azure from main.
# Reference: GitHub (2025) Building and testing .NET - https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-net
# Reference: Microsoft (2025) Deploy to App Service using GitHub Actions - https://learn.microsoft.com/en-us/azure/app-service/deploy-github-actions
#
# Deploying needs one secret (Settings -> Secrets and variables -> Actions):
#   AZURE_WEBAPP_PUBLISH_PROFILE   from Azure: Web App -> Overview -> Download publish profile
# Without it the deploy step is skipped.

name: API CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: legacies-api

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: dotnet publish -c Release --no-build -o publish

      - name: Leave out development settings
        run: rm -f publish/appsettings.Development.json

      - name: Upload the published API
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: publish/

  deploy:
    name: Deploy to Azure
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download the published API
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: publish

      - name: Check for the publish profile secret
        id: check
        env:
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: echo "ready=$([ -n "$PROFILE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure App Service
        if: steps.check.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      - name: Skipped (no secret)
        if: steps.check.outputs.ready != 'true'
        run: echo "::warning::AZURE_WEBAPP_PUBLISH_PROFILE is not set, so the API was not deployed."
